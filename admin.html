<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chakma Ludo - Admin Dashboard</title>
  
  <!-- FIX: Complete Working CDN Links -->
  <script src="https://jsdelivr.net"></script>
  <link rel="stylesheet" href="https://cloudflare.com">
  
  <!-- FIX: Complete Firebase Compat SDKs -->
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen pb-10">

  <!-- Admin Header Section -->
  <header class="bg-red-700 text-center py-6 shadow-md rounded-b-2xl border-b-4 border-red-900">
    <h1 class="text-3xl font-bold tracking-wide uppercase"><i class="fa-solid fa-user-shield"></i> Admin Control Panel</h1>
    <p class="text-red-200 text-sm mt-1">Chakma Ludo - Tournament Management</p>
  </header>

  <main class="max-w-md mx-auto px-4 mt-6 space-y-6">
    
    <!-- Admin Authentication Section -->
    <section class="bg-gray-800 p-5 rounded-2xl shadow-lg border border-gray-700 text-center space-y-4">
      <h3 class="text-lg font-bold text-red-400"><i class="fa-solid fa-lock"></i> Admin Verify</h3>
      <div id="adminProfile" class="hidden flex flex-col items-center space-y-2">
        <img id="adminAvatar" class="w-16 h-16 rounded-full border-2 border-red-500 shadow-md" alt="Admin Avatar">
        <h2 id="adminName" class="text-xl font-semibold text-gray-300">Admin</h2>
      </div>
      <button id="googleSignInBtn" class="w-full flex items-center justify-center gap-3 bg-white text-gray-700 font-medium px-4 py-2.5 rounded-xl shadow transition active:scale-95 hover:bg-gray-100">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#EA4335" d="M12 5.04c1.61 0 3.06.56 4.2 1.64l3.15-3.15C17.45 1.67 14.96 1 12 1 7.35 1 3.4 3.65 1.5 7.5l3.6 2.8C6.01 7.15 8.79 5.04 12 5.04z"/>
          <path fill="#4285F4" d="M23.5 12.25c0-.82-.07-1.6-.21-2.35H12v4.45h6.45c-.28 1.47-1.11 2.71-2.36 3.55l3.6 2.8c2.1-1.94 3.31-4.8 3.31-8.45z"/>
          <path fill="#FBBC05" d="M5.1 14.7c-.24-.71-.38-1.47-.38-2.25s.14-1.54.38-2.25L1.5 7.4C.54 9.3 0 11.43 0 13.7s.54 4.4 1.5 6.3l3.6-2.9z"/>
          <path fill="#34A853" d="M12 23c3.24 0 5.97-1.07 7.96-2.91l-3.6-2.8c-1.1.74-2.52 1.18-4.36 1.18-3.21 0-5.99-2.11-6.95-5.26l-3.6 2.8C3.4 20.35 7.35 23 12 23z"/>
        </svg>
        Sign In as Admin
      </button>
    </section>

    <!-- Create New Tournament Section -->
    <section class="bg-gray-800 p-5 rounded-2xl shadow-lg border border-gray-700 space-y-4">
      <h3 class="text-lg font-bold text-red-400 border-b border-gray-700 pb-2 flex items-center gap-2">
        <i class="fa-solid fa-plus"></i> Host New Match
      </h3>
      <div class="space-y-3">
        <div>
          <label class="text-xs text-gray-400 font-medium">Match Title</label>
          <input id="matchTitle" type="text" placeholder="e.g., Weekend Special" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-red-500 text-white">
        </div>
        <div class="flex gap-2">
          <div class="flex-1">
            <label class="text-xs text-gray-400 font-medium">Entry Fee (₹)</label>
            <input id="matchEntry" type="number" placeholder="10" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-red-500 text-white">
          </div>
          <div class="flex-1">
            <label class="text-xs text-gray-400 font-medium">Prize Pool (₹)</label>
            <input id="matchPrize" type="number" placeholder="35" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-red-500 text-white">
          </div>
        </div>
        <button id="createMatchBtn" class="w-full bg-red-600 hover:bg-red-500 py-2.5 rounded-xl text-sm font-bold tracking-wide transition shadow">Publish Tournament</button>
      </div>
    </section>

    <!-- Users Withdrawal Requests Monitor -->
    <section class="bg-gray-800 p-5 rounded-2xl shadow-lg border border-gray-700 space-y-4">
      <h3 class="text-lg font-bold text-red-400 border-b border-gray-700 pb-2 flex items-center gap-2">
        <i class="fa-solid fa-hand-holding-dollar"></i> Withdrawal Requests
      </h3>
      <div id="adminWithdrawalsList" class="text-center py-6 text-gray-500 text-sm italic">
        No pending withdrawal requests.
      </div>
    </section>

  </main>

  <script>
    // --- INTEGRATED FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyDJcvicOzv-lrqDp9ALDsB5WRvsmg0RgS8",
      authDomain: "ludo-janong.firebaseapp.com",
      databaseURL: "https://ludo-janong-default-rtdb.firebaseio.com",
      projectId: "ludo-janong",
      storageBucket: "ludo-janong.firebasestorage.app",
      messagingSenderId: "484632949978",
      appId: "1:484632949978:web:8a228c9303444dfed461e3"
    };
    
    // Initialize Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const database = firebase.database();

    // DOM Elements
    const googleSignInBtn = document.getElementById('googleSignInBtn');
    const adminProfile = document.getElementById('adminProfile');
    const adminName = document.getElementById('adminName');
    const adminAvatar = document.getElementById('adminAvatar');
    const createMatchBtn = document.getElementById('createMatchBtn');

    // --- GOOGLE SIGN-IN FOR ADMIN ---
    googleSignInBtn.addEventListener('click', () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then((result) => {
          const user = result.user;
          adminName.textContent = user.displayName;
          adminAvatar.src = user.photoURL;
          adminProfile.classList.remove('hidden');
          googleSignInBtn.classList.add('hidden');
          alert("Admin Verified: " + user.displayName);
        })
        .catch((error) => {
          console.error("Admin Login Error: ", error.message);
          alert("Admin login fail: " + error.message);
        });
    });

    // --- CREATE TOURNAMENT LOGIC ---
    createMatchBtn.addEventListener('click', () => {
      const title = document.getElementById('matchTitle').value;
      const entry = document.getElementById('matchEntry').value;
      const prize = document.getElementById('matchPrize').value;

      if (!title || !entry || !prize) {
        alert("Please fill all tournament fields.");
        return;
      }

      // Saving tournament data directly to Firebase Realtime Database
      const tournamentId = database.ref().child('tournaments').push().key;
      database.ref('tournaments/' + tournamentId).set({
        title: title,
        entryFee: "₹" + entry,
        prizePool: "₹" + prize,
        status: "active"
      }).then(() => {
        alert("Tournament Published Successfully!");
        document.getElementById('matchTitle').value = "";
        document.getElementById('matchEntry').value = "";
        document.getElementById('matchPrize').value = "";
      }).catch((err) => {
        alert("Database error: " + err.message);
      });
    });
  </script>
</body>
</html>
