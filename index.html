><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chakma Ludo Tournament</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Firebase SDKs (v8) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        .ludo-grid { display: grid; grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr); aspect-ratio: 1; }
        .star-tile { background-image: url('https://flaticon.com'); background-size: 70%; background-repeat: no-repeat; background-position: center; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col max-w-md mx-auto shadow-2xl relative overflow-x-hidden">

    <!-- Custom Toast Notification -->
    <div id="toastAlert" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-full font-bold shadow-lg hidden z-50 transition-all duration-300"></div>

    <!-- Auth Screen -->
    <div id="authScreen" class="flex flex-col items-center justify-center flex-grow p-6 bg-gradient-to-b from-gray-800 to-gray-900">
        <div class="text-center mb-8">
            <i class="fa-solid fa-dice-five text-6xl text-emerald-500 animate-bounce"></i>
            <h1 class="text-3xl font-extrabold tracking-wider mt-4 text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">CHAKMA LUDO</h1>
            <p class="text-gray-400 text-sm mt-1">Tournament Edition</p>
        </div>
        <button id="googleLoginBtn" class="w-full bg-white text-gray-900 font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-3 shadow-lg hover:bg-gray-100 transition-all active:scale-95">
            <img src="https://wikimedia.org" class="w-6 h-6" alt="Google">
            Sign In with Google
        </button>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboardScreen" class="hidden flex-col flex-grow">
        <!-- Header -->
        <header class="bg-gray-800 p-4 rounded-b-2xl border-b border-gray-700 flex items-center justify-between shadow-md">
            <div class="flex items-center gap-3">
                <img id="userAvatar" src="" alt="Avatar" class="w-11 h-11 rounded-full border-2 border-emerald-500 shadow-md">
                <div>
                    <h2 id="userName" class="font-bold text-sm truncate max-w-[120px]">Player</h2>
                    <span class="text-xs text-emerald-400 font-semibold"><i class="fa-solid fa-wallet mr-1"></i>₹<span id="userWallet">0</span></span>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleSection('walletModal')" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-xs font-bold transition-all"><i class="fa-solid fa-plus mr-1"></i>Money</button>
                <button id="logoutBtn" class="text-gray-400 hover:text-red-400 p-2"><i class="fa-solid fa-right-from-bracket text-lg"></i></button>
            </div>
        </header>

        <!-- Social & Tabs Navbar -->
        <div class="flex bg-gray-800 border-b border-gray-700">
            <button onclick="switchTab('lobby')" id="tab-lobby" class="flex-1 py-3 text-center font-bold text-sm border-b-2 border-emerald-500 text-emerald-400">Lobby</button>
            <button onclick="switchTab('social')" id="tab-social" class="flex-1 py-3 text-center font-bold text-sm border-b-2 border-transparent text-gray-400">Social & Chat</button>
        </div>

        <!-- Tab Content: Lobby -->
        <div id="lobbyTab" class="p-4 space-y-4 flex-grow overflow-y-auto pb-20">
            <h3 class="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400"><i class="fa-solid fa-trophy mr-2 text-yellow-400"></i>Active Tournaments</h3>
            <div id="matchesList" class="space-y-3">
                <!-- Matches load dynamically -->
                <div class="text-center text-gray-500 text-sm py-8">No live matches available right now.</div>
            </div>
        </div>

        <!-- Tab Content: Social & Chat -->
        <div id="socialTab" class="hidden p-4 flex-col flex-grow overflow-y-auto pb-20 space-y-4">
            <!-- Global Chat Box -->
            <div class="bg-gray-800 rounded-xl p-3 border border-gray-700 flex flex-col h-64 shadow-inner">
                <h4 class="text-xs font-bold text-cyan-400 mb-2 border-b border-gray-700 pb-1"><i class="fa-solid fa-comments mr-1"></i>Global Live Chat</h4>
                <div id="chatMessages" class="flex-grow overflow-y-auto text-sm space-y-2 mb-2 pr-1"></div>
                <div class="flex gap-2">
                    <input type="text" id="chatInput" placeholder="Type a message..." class="flex-grow bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-emerald-500">
                    <button onclick="sendChatMessage()" class="bg-cyan-600 px-3 py-1.5 rounded-lg text-sm font-bold"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
            <!-- Follow System -->
            <div class="bg-gray-800 rounded-xl p-3 border border-gray-700">
                <h4 class="text-xs font-bold text-emerald-400 mb-3"><i class="fa-solid fa-user-plus mr-1"></i>Follow Other Players</h4>
                <div class="flex gap-2 mb-3">
                    <input type="text" id="searchUserField" placeholder="Enter Player Name..." class="flex-grow bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-xs focus:outline-none">
                    <button onclick="followUser()" class="bg-emerald-600 px-3 py-1.5 rounded-lg text-xs font-bold">Follow</button>
                </div>
                <div id="followList" class="space-y-2 text-xs">
                    <!-- Followed list loads here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Financial Wallet Modal -->
    <div id="walletModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 items-center justify-center p-6">
        <div class="bg-gray-800 w-full max-w-xs rounded-2xl p-5 border border-gray-700 shadow-xl relative animate-fade-in">
            <button onclick="toggleSection('walletModal')" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="text-lg font-bold border-b border-gray-700 pb-2 mb-4 text-center text-emerald-400"><i class="fa-solid fa-wallet mr-2"></i>In-App Wallet</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Add Demo Money (₹)</label>
                    <div class="flex gap-2">
                        <input type="number" id="depositAmount" value="100" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2 text-sm focus:outline-none text-center">
                        <button onclick="handleDeposit()" class="bg-emerald-600 px-4 rounded-xl text-xs font-bold">Deposit</button>
                    </div>
                </div>
                <div class="border-t border-gray-700 pt-3">
                    <label class="block text-xs text-gray-400 mb-1">Withdraw Money (₹)</label>
                    <div class="flex gap-2">
                        <input type="number" id="withdrawAmount" placeholder="Min ₹50" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2 text-sm focus:outline-none text-center">
                        <button onclick="handleWithdrawal()" class="bg-red-600 px-4 rounded-xl text-xs font-bold">Withdraw</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Ludo Gameplay Canvas Screen -->
    <div id="gameplayScreen" class="hidden fixed inset-0 bg-gray-900 z-40 flex flex-col p-4 max-w-md mx-auto justify-center items-center">
        <div class="w-full flex justify-between items-center mb-4">
            <span class="text-sm font-bold text-cyan-400"><i class="fa-solid fa-gamepad mr-1"></i> Room: <span id="currentRoomId">0000</span></span>
            <button onclick="exitGameScreen()" class="bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white text-xs font-bold px-3 py-1.5 rounded-lg transition-all"><i class="fa-solid fa-door-open mr-1"></i>Leave</button>
        </div>
        
        <!-- Interactive Ludo Board -->
        <div id="ludoBoard" class="w-full bg-white text-black p-1 rounded-xl shadow-2xl ludo-grid border-4 border-gray-700">
            <!-- Grid Generation Logic Executed in Script -->
        </div>

        <!-- Dice Rolling Controls -->
        <div class="w-full mt-6 bg-gray-800 rounded-2xl p-4 border border-gray-700 flex items-center justify-around shadow-lg">
            <div class="text-center">
                <p class="text-xs text-gray-400">Current Turn</p>
                <div id="turnIndicator" class="text-sm font-black text-red-500 mt-1">RED PLAYER</div>
            </div>
            <button id="rollDiceBtn" onclick="rollDicePhysics()" class="bg-gradient-to-r from-emerald-500 to-cyan-500 text-white font-extrabold px-6 py-3 rounded-xl shadow-md hover:brightness-110 active:scale-95 transition-all text-sm flex items-center gap-2">
                <i class="fa-solid fa-dice text-lg animate-spin-slow"></i> ROLL DICE
            </button
